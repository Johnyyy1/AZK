services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - backend
      - db
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgres://aquasmart:aquasmart@db:5432/aquasmart}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-in-production}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 4000
      LOGO_IP: ${LOGO_IP:-192.168.0.3}
      LOGO_PORT: ${LOGO_PORT:-502}
      UNIT_ID: ${UNIT_ID:-1}
      READ_INTERVAL_MS: ${READ_INTERVAL_MS:-2000}
      REGISTER_OFFSET: ${REGISTER_OFFSET:-0}
      REGISTER_COUNT: ${REGISTER_COUNT:-1}
      PUMP_WRITE_MODE: ${PUMP_WRITE_MODE:-coil}
      PUMP_COIL_ADDRESS: ${PUMP_COIL_ADDRESS:-8256}
      PUMP_REGISTER_ADDRESS: ${PUMP_REGISTER_ADDRESS:-}
      PUMP_REGISTER_ON_VALUE: ${PUMP_REGISTER_ON_VALUE:-1}
      PUMP_REGISTER_OFF_VALUE: ${PUMP_REGISTER_OFF_VALUE:-0}
      AQUASMART_CLOUD_URL: ${AQUASMART_CLOUD_URL:-}
      AQUASMART_AGENT_TOKEN: ${AQUASMART_AGENT_TOKEN:-}
      AGENT_SYNC_INTERVAL_MS: ${AGENT_SYNC_INTERVAL_MS:-2000}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aquasmart}
      POSTGRES_USER: ${POSTGRES_USER:-aquasmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aquasmart}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aquasmart-db:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  aquasmart-db:
